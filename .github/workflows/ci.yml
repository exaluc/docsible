name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint (${{ matrix.python-version }})
    # If a PR is open from this repo's branch, skip the duplicate push run
    if: github.event_name != 'push' || github.ref_name == 'main' || !github.event.pull_request
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Check lockfile sync
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run linting
        run: uv run ruff check docsible
      - name: Run type checking
        run: uv run mypy docsible
      - name: Run tests
        run: uv run pytest