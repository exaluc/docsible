# Standard Python project metadata (PEP 621) - works with uv, pip, pyenv
[project]
name = "docsible-jier"
version = "0.9.0"
description = "An explicitly attributed fork of Docsible for Ansible role and collection documentation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lucian BLETAN", email = "neuraluc@gmail.com"}
]
maintainers = [
    {name = "Jier Nzuanzu", email = "6737870+jier@users.noreply.github.com"}
]
keywords = ["ansible", "documentation", "roles", "collections", "readme", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Documentation",
    "Topic :: System :: Systems Administration",
]

# =========================================================
# Core dependencies
# =========================================================
dependencies = [
    "click>=8.1.7",
    "PyYAML>=6.0.1",
    "Jinja2>=3.1.2",
    "pydantic>=2.0.0",
]

# =========================================================
# Development dependencies
# =========================================================
[dependency-groups]
dev = [
    "build>=1.2.2",
    "pytest>=7.4.4",
    "ruff>=0.14.8",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

# =========================================================
# Ruff (Linting & Formatting) 
# =========================================================
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E"]

# =========================================================
# Mypy (static typing and plugins)
# =========================================================
[tool.mypy]
plugins = ['pydantic.mypy']

python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# =========================================================
# Pytest
# =========================================================
[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "-v"
]

# =========================================================
# Project information
# =========================================================
# URLs for project
[project.urls]
Homepage = "https://github.com/jier/docsible"
Repository = "https://github.com/jier/docsible"
Issues = "https://github.com/jier/docsible/issues"
Upstream = "https://github.com/docsible/docsible"

# =========================================================
# Project cli entrypoint
# =========================================================
# Entry points (scripts) - works with uv, pip
[project.scripts]
docsible = "docsible.cli:cli"

# =========================================================
# Build system (Hatch)
# =========================================================
# Build system configuration - supports multiple backends
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatch configuration for building
[tool.hatch.build.targets.wheel]
packages = ["docsible"]

[tool.hatch.build.targets.sdist]
include = [
    "/docsible",
    "/README.md",
    "/LICENSE",
    "/CONFIGURATION.md",
]
